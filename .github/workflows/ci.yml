name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright (Chromium + ffmpeg)
        run: npx playwright install --with-deps chromium ffmpeg

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Capture docs media
        run: |
          npm run start &
          npx --yes wait-on@3.3.0 http://127.0.0.1:3000 --timeout 120000
          APP_URL=http://127.0.0.1:3000 SKIP_README_CAPTURE=1 npm run capture:media

      - name: Verify docs/media is up to date
        run: |
          git diff --exit-code docs/media || (
            echo "::error::docs/media is out of date. Run: npm run build, npm run start, then APP_URL=http://127.0.0.1:3000 npm run capture:media (and commit docs/media)."
            exit 1
          )
